@@include('partials/html-start.html', { "title": "문의하기" })
<header class="header_menu sty_1">
    <div class="inner">
        <div class="back_btn" onclick="history.back()">
            <img class="back" src="@@imgPath/ico/ico_back.png" alt="뒤로가기">
        </div>
        <p class="page_tit center_txt">문의하기</p>
    </div>
</header>

<section class="contents">
    <div class="inner">
        <div class="cart_item inquiry_item mb-30 pb-30">
            <div class="list">
                <div class="info_con">
                    <div class="item_info">
                        <div class="box">
                            <div class="rect">
                                <img class="img" src="@@imgPath/img/img_item_sample.png" alt="상품이미지">
                            </div>
                            <div class="txt_con">
                                <div class="d-flex justify-content-between align-items-center">
                                    <p class="brand">포메라니안 / 남</p>
                                    <p class="nose ">비문</p>
                                </div>
                                <div class="breed_con">
                                    <p class="breed"><b>모견</b>포메라니안</p>
                                    <p class="breed"><b>부견</b>포메라니안</p>
                                </div>
                                <p class="birth">2025.02.01 (6개월)</p>
                            </div>
                        </div>
                        <p class="vaccine" data-bs-toggle="offcanvas" data-bs-target="#offcanvasBottom"
                            aria-controls="offcanvasBottom">예방접종여부</p>
                    </div>
                </div>
                <div class="price_con">
                    <p class="t1">금액</p>
                    <p class="price">250,000원</p>
                </div>
            </div>
        </div>

        <div class="form-group">
            <div class="mb-20">
                <label class="input_label require" for="title">문의제목</label>
                <input type="text" class="form-control" id="title" aria-describedby="emailHelp"
                    placeholder="문의제목을 입력해주세요.">
                <div class="valid-feedback">
                    Looks good!
                </div>
            </div>
            <div class="mb-20">
                <label class="input_label require" for="title">문의내용</label>
                <textarea class="form-control inquiry_textarea" id="exampleFormControlTextarea1" rows="3"
                    placeholder="문의내용을 입력해주세요."></textarea>
            </div>
        </div>

        <div class="img_upload mb-30">
            <p class="tit">이미지 등록</p>
            <div class="touch_scroll scroll_bar_none">
                <div class="upload_con">
                    <div class="image_upload">
                        <input id="ip_file" type="file" class="d-none">
                        <label for="ip_file" class="upload_box">
                            <div class="rect">
                            </div>
                            <p class="max_img">이미지등록</p>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn_con register_btn">
            <button class="btn btn-main w-100">등록하기</button>
        </div>
    </div>
    <div class="offcanvas offcanvas-bottom" tabindex="-1" id="offcanvasBottom" aria-labelledby="offcanvasBottomLabel">
        <div class="offcanvas-header">
            <p class="offcanvas-title" id="offcanvasBottomLabel">예방접종</p>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body small">
            <ul class="vaccine_list">
                <li class="list">
                    <p class="vaccine on">코로나 장염 1차</p>
                </li>
                <li class="list">
                    <p class="vaccine off">코로나 장염 2차</p>
                </li>
                <li class="list">
                    <p class="vaccine on">켄넬코프 1차</p>
                </li>
                <li class="list">
                    <p class="vaccine off">켄넬코프 2차</p>
                </li>
                <li class="list">
                    <p class="vaccine on">신종플루 1차</p>
                </li>
                <li class="list">
                    <p class="vaccine on">광견병 예방접종</p>
                </li>
                <li class="list">
                    <p class="vaccine on">심장사상충 예방</p>
                </li>
            </ul>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const container = document.querySelector(".touch_scroll .upload_con");
            const fileInput = document.querySelector(".image_upload input[type=file]"); // 업로드 버튼의 input만 선택

            // 파일 선택 이벤트
            fileInput.addEventListener("change", function (e) {
                const files = e.target.files;
                if (!files.length) return;

                for (let file of files) {
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        // 새로운 이미지 업로드 박스 생성
                        const newBox = document.createElement("div");
                        newBox.classList.add("image_upload", "on");

                        newBox.innerHTML = `
          <input type="file" class="d-none">
          <label class="upload_box">
            <div class="rect">
              <img src="${event.target.result}" alt="업로드 이미지">
            </div>
          </label>
          <button type="button" class="btn upload_del">
            <img src="/assets/images/ico/ico_x2.png">
          </button>
        `;

                        // 삭제 버튼 기능
                        newBox.querySelector(".upload_del").addEventListener("click", function () {
                            newBox.remove();
                        });

                        // 항상 업로드 버튼 뒤에 추가
                        container.appendChild(newBox);
                    };
                    reader.readAsDataURL(file);
                }

                // input 초기화 (같은 파일 다시 선택 가능하게)
                e.target.value = "";
            });
        });

    </script>
</section>

<nav class="ft_nav"></nav>

@@include('partials/html-end.html')
