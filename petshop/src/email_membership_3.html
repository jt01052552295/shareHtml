@@include('partials/html-start.html', { "title": "이메일 회원가입" })
<header class="header_menu sty_1">
    <div class="inner">
        <div class="back_btn" onclick="history.back()">
            <img class="back" src="@@imgPath/ico/ico_back.png" alt="뒤로가기">
        </div>
        <p class="page_tit center_txt">이메일 회원가입</p>
    </div>
</header>

<section class="contents">
    <div class="inner">
        <div class="form-group">
            <div class="mb-20">
                <label class="input_label require" for="email">이메일</label>
                <input type="email" class="form-control" id="email" aria-describedby="emailHelp"
                    placeholder="example@example.com">
                <div class="invalid-feedback" style="display: block;">
                    이미 가입한 계정입니다.
                </div>
            </div>

            <div class="mb-20">
                <label class="input_label require" for="password">비밀번호</label>
                <input type="text" class="form-control mb-10" id="password" aria-describedby="emailHelp"
                    placeholder="영문/숫자/특수문자 혼합 8~20자">
                <input type="text" class="form-control" id="name" aria-describedby="emailHelp"
                    placeholder="비밀번호를 한번 더 입력해주세요">
                <div class="valid-feedback">
                    Looks good!
                </div>
            </div>

            <div class="mb-20">
                <label class="input_label require" for="nickname">닉네임</label>
                <input type="email" class="form-control" id="nickname" aria-describedby="emailHelp"
                    placeholder="닉네임을 입력해주세요">
                <div class="valid-feedback">
                    Looks good!
                </div>
            </div>

            <div class="mb-20">
                <label class="input_label require" for="phone">휴대폰 번호</label>
                <input type="text" class="form-control mb-10" id="phone" aria-describedby="emailHelp"
                    placeholder="'-'를 제외한 숫자만 입력해주세요">
                <input type="text" class="form-control" id="phone" aria-describedby="emailHelp"
                    placeholder="인증번호 6자리를 입력해주세요">
                <div class="invalid-feedback">
                    Please choose a username.
                </div>
                <button class="btn btn-main w-100 btn-height mt-10">인증하기</button>
            </div>

            <div class="mb-20">
                <label class="input_label require" for="company_num">사업자등록증</label>
                <input type="text" class="form-control" id="company_num" aria-describedby="emailHelp"
                    placeholder="사업자 등록번호 직접 입력 (10자리)">
                <div class="valid-feedback">
                    Looks good!
                </div>
            </div>
        </div>

        <div class="check_con">
            <div class="checkbox-wrap all_check pb-15 mb-15">
                <input type="checkbox" id="cb1" class="cb-input" />
                <label for="cb1" class="cb-label tit">약관 전체 동의</label>
            </div>
            <ul class="cb_list">
                <li class="checkbox-wrap">
                    <input type="checkbox" id="cb2" class="cb-input" />
                    <label for="cb2" class="cb-label"><span class="point">(필수)</span>본인은 만 14세 이상입니다.</label>
                </li>
                <li class="checkbox-wrap">
                    <input type="checkbox" id="cb3" class="cb-input" />
                    <label for="cb3" class="cb-label"><span class="point">(필수)</span>서비스 이용약관 동의</label>
                </li>
                <li class="checkbox-wrap">
                    <input type="checkbox" id="cb4" class="cb-input" />
                    <label for="cb4" class="cb-label"><span class="point">(필수)</span>개인정보 수집 및 이용동의</label>
                </li>
                <li class="checkbox-wrap">
                    <input type="checkbox" id="cb5" class="cb-input" />
                    <label for="cb5" class="cb-label"><span class="gray">(선택)</span>광고성 정보 수신 전체동의</label>
                </li>
            </ul>
        </div>

        <button class="btn btn-secondary w-100 mt-30 btn-height mb-30">동의하고 가입하기</button>
    </div>
</section>

<nav class="ft_nav"></nav>

@@include('partials/html-end.html')
