<nav class="ft_nav"></nav><!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    // faq
    const faqItems = document.querySelectorAll(".faq-item");

    faqItems.forEach(item => {
        const question = item.querySelector(".faq-question");
        const answer = item.querySelector(".faq-answer");

        question.addEventListener("click", () => {
            const isOpen = item.classList.contains("open");

            // 닫기
            if (isOpen) {
                answer.style.maxHeight = answer.scrollHeight + "px"; // 현재 높이를 강제로 설정
                requestAnimationFrame(() => {
                    item.classList.remove("open");
                    answer.style.maxHeight = "0px";
                });
                return;
            }

            // 열기
            item.classList.add("open");
            answer.style.maxHeight = answer.scrollHeight + "px";

            answer.addEventListener(
                "transitionend",
                () => {
                    answer.style.maxHeight = "none"; // 열린 뒤엔 auto처럼 사용
                },
                { once: true }
            );
        });
    });

    let category; // 전역 선언

    async function detailData(id) {
        try {
            let response = await fetch('assets/data/petDetail.json');
            if (!response.ok) throw new Error('데이터를 불러올 수 없습니다.');

            let data = await response.json();
            const idNum = Number(id);
            const info = data.find(item => item.id === idNum);

            if (!info) throw new Error('해당 id의 데이터가 없습니다.');

            // ------- 화면 렌더링 -------
            const banner = document.querySelector('.pet_banner');
            banner.innerHTML = `<img class="pet_banner_img" src="${info.img}" alt="">`;

            const pageTitle = document.querySelector('.page_tit');
            pageTitle.innerText = info.breed;

            const sellTit = document.querySelector('.cate_sell .detail_tit');
            sellTit.innerText = `현재 판매중인 ${info.breed}`

            infoDetail.innerHTML = `
            <ul class="info_summary">
                <li class="list">
                    <img class="icon" src="@@imgPath/ico/ico_summary_1.png" alt="">
                    <p class="t1">크기</p>
                    <p class="t2">${info.size}</p>
                </li>
                <li class="list">
                    <img class="icon" src="@@imgPath/ico/ico_summary_2.png" alt="">
                    <p class="t1">성격</p>
                    <p class="t2">${info.personality}</p>
                </li>
                <li class="list">
                    <img class="icon" src="@@imgPath/ico/ico_summary_3.png" alt="">
                    <p class="t1">수명</p>
                    <p class="t2">${info.lifespan}</p>
                </li>
                <li class="list">
                    <img class="icon" src="@@imgPath/ico/ico_summary_4.png" alt="">
                    <p class="t1">양육 난이도</p>
                    <p class="t2">${info.difficulty}</p>
                </li>
            </ul>

            <div class="about_breed">
                <p class="detail_tit">품종소개</p>
                <p class="t1">${info.breedIntroduction}</p>
            </div>

            <div class="breed_detail">
                <p class="detail_tit">품종 특징 상세</p>
                <ul class="detail"></ul>
            </div>
        `;

            // 상세 반복
            const detailUl = infoDetail.querySelector('.breed_detail .detail');
            Object.entries(info.details).forEach(([category, arr]) => {
                let liHtml = `<li class="list"><p class="tit">${category}</p>`;
                arr.forEach(text => {
                    liHtml += `<p class="t1">${text}</p>`;
                });
                liHtml += `</li>`;
                detailUl.innerHTML += liHtml;
                console.log(category, arr)
            });

            return info;

        } catch (err) {
            console.log(err, '데이터 에러');
        }
    }

    // -------------------- CATEGORY -------------------

    async function categoryData(breed) {
        try {
            let response = await fetch('assets/data/pets.json');
            if (!response.ok) throw new Error('데이터를 불러올 수 없습니다.');

            let data = await response.json();
            const cateWrapper = document.querySelector('#cate .swiper-wrapper');

            cateWrapper.innerHTML = "";

            // 필터
            let filtered = breed ? data.filter(item => item.breed === breed) : data;

            // DOM 생성
            filtered.forEach(item => {
                cateWrapper.innerHTML += `
                <div class="swiper-slide">
                    <a class="item_box" href="pet_detail.html?id=${item.id}">
                        <div class="rect">
                            <img class="img" src="${item.img}" alt="${item.breed}">
                        </div>
                        <div class="txt_con">
                            <p class="region">[${item.region || '지역'}]</p>
                            <p class="shop_name text_line_1">${item.shop_name || '견사 이름'}</p>
                            <p class="breed">${item.breed}</p>
                            <p class="price">${item.price ? item.price.toLocaleString() + '원' : '문의'}</p>
                        </div>
                        <div class="rate_con">
                            <p class="rating">${item.rating || '5.0'}<span class="sum"> (${item.review || 0})</span></p>
                        </div>
                    </a>
                </div>
            `;
            });

        } catch (err) {
            console.log(err, '카테고리 에러');
        }
    }

    // ------------------------------------------------------
    // URL → detailData → categoryData → Swiper 초기화
    // ------------------------------------------------------

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    detailData(id).then(info => {
        if (info && info.breed) {
            categoryData(info.breed).then(() => {

                // 이제 슬라이드가 DOM에 있음 → Swiper 생성
                category = new Swiper("#cate", {
                    slidesPerView: 3.3,
                    spaceBetween: 8,
                });

            });
        }
    });

</script>
@@include('partials/html-end.html')
