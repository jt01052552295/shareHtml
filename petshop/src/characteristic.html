<script>

  async function categoryData() {
    try {
      let response = await fetch('assets/data/petDetail.json')
      if (!response.ok) {
        throw new Error('데이터를 불러올 수 없습니다.')
      }

      let data = await response.json();
      // console.log(data)

      const petList = document.querySelector('.pet_list')

      petList.innerHTML = data.map(pet => `
          <li class="list">
        <a href="characteristic_detail.html?id=${pet.id}" class="link">
          <img class="pet_img" src="${pet.img}" alt="">
          <div class="txt_con">
            <p class="t1">${pet.breed}</p>
          </div>
        </a>
      </li>
      `).join('')

    } catch (err) {
      console.log(err)
    }
  }

  categoryData()
</script>
