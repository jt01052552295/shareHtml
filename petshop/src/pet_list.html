<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<!-- Initialize Swiper -->
<script>

    var filter_slide = new Swiper(".filter_slide", {
        slidesPerView: "auto",
        spaceBetween: 8,

    });

    let petsData = []; // 전체 데이터를 저장해둘 변수

    // JSON 데이터 불러오기
    fetch('assets/data/pets.json')
        .then(response => {
            if (!response.ok) {
                throw new Error('데이터를 불러올 수 없습니다.')
            }
            return response.json();
        })
        .then(data => {
            petsData = data; // 불러온 데이터를 저장
            renderList(petsData); // 초기 전체 리스트 렌더
        })
        .catch(error => console.log(error));

    // 리스트 렌더 함수
    function renderList(data) {
        const listEl = document.querySelector('#pet_list');
        listEl.innerHTML = data.map(item =>
            `
        <li class="item">
            <a href="pet_detail.html?id=${item.id}" class="link">
                <div class="img_con rect">
                    <img src="${item.img}" alt="${item.breed}" class="img">
                </div>
                <div class="txt_con">
                    <p class="region">[${item.region}]</p>
                    <p class="shop_name text_line_1">${item.shop_name}</p>
                    <p class="breed">${item.breed}</p>
                    <p class="price">${item.price.toLocaleString()}원</p>
                </div>
                <div class="rate_con">
                    <p class="rating">${item.rating}<span class="sum"> (${item.reviews})</span></p>
                </div>
            </a>
        </li>
        `
        ).join('');

        const itemSum = document.querySelector('.item_sum .sum')
        const count = Array.isArray(data) ? data.length : 0;

        itemSum.innerHTML = `총 <span class="num">${count}</span>개`;

    }

    // 검색 기능
    const searchInput = document.querySelector('.search_input');
    const searchBtn = document.querySelector('.search_btn');

    searchBtn.addEventListener('click', () => {
        const keyword = searchInput.value.trim().toLowerCase();
        const filtered = petsData.filter(item =>
            item.breed.toLowerCase().includes(keyword) ||
            item.shop_name.toLowerCase().includes(keyword) ||
            item.region.toLowerCase().includes(keyword)
        );
        renderList(filtered);
    });

    // Enter 키로도 검색 가능
    searchInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') searchBtn.click();
    });

    const filterCon = document.querySelector('.filter_con');
    const filterBtns = filterCon.querySelectorAll('.filter_slide .swiper-slide')

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            // 1️⃣ 모든 버튼 active 제거 후 클릭한 버튼만 추가
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // 2️⃣ 버튼 텍스트 가져오기
            const btnText = btn.innerText.trim().toLowerCase();

            // 3️⃣ 필터링
            let filtereds;
            if (btnText === '전체') {
                filtereds = petsData; // 전체
            } else {
                filtereds = petsData.filter(item =>
                    item.breed.toLowerCase().includes(btnText)
                );
            }

            // 4️⃣ 총 개수 업데이트
            const itemSum = document.querySelector('.item_sum .sum');
            const count = Array.isArray(filtereds) ? filtereds.length : 0;
            if (itemSum) {
                itemSum.innerHTML = `총 <span class="num">${count}</span>개`;
            }

            // 5️⃣ 리스트 렌더링
            const listEl = document.querySelector('#pet_list');
            if (!listEl) return;

            if (count === 0) {
                // 데이터 없는 경우
                listEl.innerHTML = `
        <li class="no_data">
          <img src="@@imgPath/img/img_no_data.png" alt="no data" />
          <p>해당 종류의 펫이 없습니다.</p>
        </li>
      `;
            } else {
                // 데이터 있을 때 렌더
                renderList(filtereds);
            }
        });
    });



</script>
