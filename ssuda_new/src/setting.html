@@include('partials/html-start.html', { "title": "앱 설정" })
<header class="header_menu">
  <div class="inner d-flex justify-content-between align-items-center">
    <button class="btn p-0" onclick="history.back()">
      <img src="./assets/images/icon/ico_back.png" alt="" />
    </button>
    <p class="title fs-20 fw-bold">앱 설정</p>
  </div>
</header>
<div class="contents pt-70 height-100">
  <div class="setting">
    <div class="inner">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="txt_con">
          <p class="large-b">알림</p>
          <p class="small-l">앱 내의 정보/이벤트 관련 알림 허용</p>
        </div>
        <div class="form-check form-switch d-flex align-items-center gap-2">
          <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckChecked" checked>
          <label class="form-check-label" for="flexSwitchCheckDefault">Default switch checkbox input</label>
        </div>
      </div>

      <div class=" mb-3">
        <div class="form-check form-switch d-flex align-items-center gap-2">
          <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckChecked" checked>
          <label class="form-check-label" for="flexSwitchCheckDefault">Default switch checkbox input</label>
        </div>
      </div>

      <div class="form-check form-switch d-flex align-items-center gap-2 mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckDefault">
        <label class="form-check-label" for="flexSwitchCheckDefault">Default switch checkbox input</label>
      </div>
      <div class="form-check form-switch d-flex align-items-center mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckChecked" checked>
        <label class="form-check-label" for="flexSwitchCheckChecked">Checked switch checkbox input</label>
      </div>
      <div class="form-check form-switch d-flex align-items-center mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckDisabled" disabled>
        <label class="form-check-label" for="flexSwitchCheckDisabled">Disabled switch checkbox input</label>
      </div>
      <div class="form-check form-switch d-flex align-items-center mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckCheckedDisabled" checked
          disabled>
        <label class="form-check-label" for="flexSwitchCheckCheckedDisabled">Disabled checked switch checkbox
          input</label>
      </div>


      <div class="list d-flex justify-content-between">
        <div class="txt_con">
          <p class="large-b">연락방식</p>
          <p class="small-l">문서 작성 시, 연락방식으로 알림이 발송됩니다.</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#offcanvasBottom"
          aria-controls="offcanvasBottom">
          <span>카카오</span>
        </button>
      </div>
    </div>
  </div>
</div>
<div class="offcanvas offcanvas-bottom" tabindex="-1" id="offcanvasBottom" aria-labelledby="offcanvasBottomLabel">
  <div class="offcanvas-body small">
    <ul class="select">
      <li class="list">
        <button class="btn btn-link active">
          <p class="t1">카카오</p>
        </button>
      </li>
      <li class="list">
        <button class="btn btn-link">
          <p class="t1">이메일</p>
        </button>
      </li>
    </ul>
  </div>
</div>
<script>
  const toggleList = document.querySelectorAll('.toggleSwitch');

  toggleList.forEach(($toggle) => {
    $toggle.onclick = () => {
      $toggle.classList.toggle('active');
    };
  });
</script>
@@include('partials/html-end.html')
