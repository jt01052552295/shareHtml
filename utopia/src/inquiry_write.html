@@include('partials/html-start.html', { "title": "1:1 문의하기" })
<header class="header_bar sty01">
    <button class="btn p-0 back">
        <img src="@@imgPath/ico/ico_back.png" onclick="history.back()" alt="뒤로가기">
    </button>
    <p class="title">1:1 문의하기</p>
    <button class="btn p-0">
        <p class="register_btn">등록</p>
    </button>
</header>
<section class="contents">
    <div class="inner">
        <div class="form-group mt-30">
            <label class="tit" for="formGroupExampleInput">제목 <span class="required">*</span></label>
            <input type="text" class="form-control" id="formGroupExampleInput" placeholder="제목을 입력하세요.">
        </div>

        <div class="form-group mt-30">
            <label class="tit" for="formGroupExampleInput">내용 <span class="required">*</span></label>
            <textarea class="form-control" id="exampleFormControlTextarea1" placeholder="문의 내용 입력해주세요."></textarea>
        </div>

        <div class="upload_con mt-30">
            <p class="title">상세 이미지<span class="required">*</span></p>
            <div class="upload-box" id="uploadBox">
                <!-- 업로드 버튼 -->
                <label class="upload-item upload-btn" id="uploadBtn">
                    <input type="file" id="fileInput" accept="image/*" multiple>
                    <div class="upload-placeholder">
                        <img src="@@imgPath/ico/ico_camera_white.png" alt="" class="ico_camera">
                        <span class="count-label">0/9</span>
                    </div>
                </label>
            </div>
        </div>
    </div>
</section>

<script>
    const fileInput = document.getElementById("fileInput");
    const uploadBox = document.getElementById("uploadBox");
    const uploadBtn = document.getElementById("uploadBtn");
    const countLabel = uploadBtn.querySelector(".count-label");

    let filesArr = [];
    const maxFiles = 9;

    fileInput.addEventListener("change", (e) => {
        const newFiles = Array.from(e.target.files);

        newFiles.forEach(file => {
            if (filesArr.length >= maxFiles) {
                alert("최대 9장까지 업로드 가능합니다.");
                return;
            }
            filesArr.push(file);

            const reader = new FileReader();
            reader.onload = (ev) => {
                const div = document.createElement("div");
                div.classList.add("upload-item");

                div.innerHTML = `
            <img src="${ev.target.result}" alt="preview">
            <img src="@@imgPath/ico/ico_del.png" class="remove-btn">
          `;

                div.querySelector(".remove-btn").addEventListener("click", () => {
                    filesArr = filesArr.filter(f => f !== file);
                    div.remove();
                    updateCount();
                });

                // 오른쪽에 추가되도록 appendChild
                uploadBox.appendChild(div);
                updateCount();
            };
            reader.readAsDataURL(file);
        });

        fileInput.value = ""; // 같은 파일 다시 선택 가능하게 초기화
    });

    function updateCount() {
        countLabel.textContent = `${filesArr.length}/${maxFiles}`;
    }
</script>

@@include('partials/html-end.html')
