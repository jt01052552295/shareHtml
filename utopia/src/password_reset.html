@@include('partials/html-start.html', { "title": "비밀번호 재설정" })

    <p class="title">비밀번호 재설정</p>
</header>
<section class="contents">

        <div class="form-group mt-50">

        <div class="form-group mt-30">

        <button class="btn btn-lg btn-secondary w-100 mt-30"

@@include('partials/html-end.html')
