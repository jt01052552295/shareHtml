@@include('partials/html-start.html', { "title": "회원정보입력" })
<header class="header_bar sty05">
    <button class="btn back p-0">
        <img src="@@imgPath/ico/ico_back.png" onclick="history.back()" alt="뒤로가기">
    </button>
    <p class="title">회원 정보 입력</p>
</header>
<section class="contents">
    <div class="inner">
        <div class="profile-container">
            <div class="profile-image" id="profileImage">
                <img id="preview" class="profile" src="@@imgPath/ico/ico_person-fill.png" alt="프로필이미지" style="">
            </div>
            <div class="camera-icon" id="uploadBtn">
                <img src="@@imgPath/ico/ico_camera.png" alt="프로필변경">
            </div>
            <input type="file" id="fileInput" accept="image/*" />
        </div>

        <div class="form-group">
            <label class="tit" for="formGroupExampleInput">아이디 <span class="required">*</span></label>
            <div class="input_box d-flex align-items-center">
                <div class="box">
                    <input type="text" class="form-control" id="formGroupExampleInput" placeholder="이메일 형식 입력">
                </div>
                <button class="btn btn-outline-light p-0">인증요청</button>
            </div>
            <div class="input_box d-flex align-items-center mt-10">
                <div class="box">
                    <input type="text" class="form-control" id="formGroupExampleInput" placeholder="이메일 형식 입력">
                </div>
                <button class="btn btn-light p-0">확인</button>
            </div>
            <div class="invalid-feedback" style="display: block;">
                인증번호를 잘못 입력하셨습니다. 다시 입력해 주세요.
            </div>
        </div>

        <div class="form-group mt-30">
            <label class="tit" for="formGroupExampleInput">비밀번호 <span class="required">*</span></label>
            <input type="password" class="form-control" id="formGroupExampleInput"
                placeholder="영소문, 숫자, 특수문자 조합 8자리 이상">
        </div>

        <div class="form-group mt-30">
            <label class="tit" for="formGroupExampleInput">비밀번호 확인 <span class="required">*</span></label>
            <input type="password" class="form-control" id="formGroupExampleInput" placeholder="재입력해주세요">
        </div>

        <div class="form-group mt-30">
            <label class="tit" for="formGroupExampleInput">이름 <span class="required">*</span></label>
            <input type="text" class="form-control" id="formGroupExampleInput" placeholder="이름 입력">
        </div>

        <div class="form-group mt-30">
            <label class="tit" for="formGroupExampleInput">닉네임 <span class="required">*</span></label>
            <div class="input_box d-flex align-items-center">
                <div class="box">
                    <input type="text" class="form-control" id="formGroupExampleInput" placeholder="2자리 이상 입력">
                </div>
                <button class="btn btn-outline-light p-0">중복확인</button>
            </div>
            <div class="invalid-feedback" style="display: block;">
                인증번호를 잘못 입력하셨습니다. 다시 입력해 주세요.
            </div>
        </div>

        <div class="form-group mt-30">
            <label class="tit" for="formGroupExampleInput">휴대폰번호 <span class="required">*</span></label>
            <div class="input_box d-flex align-items-center">
                <div class="box">
                    <input type="text" class="form-control" id="formGroupExampleInput" placeholder="01012345678">
                    <p class="time">04:58</p>
                </div>
                <button class="btn btn-outline-light p-0">인증요청</button>
            </div>
            <div class="input_box d-flex align-items-center mt-10">
                <div class="box">
                    <input type="text" class="form-control" id="formGroupExampleInput" placeholder="인증번호 입력">
                </div>
                <button class="btn btn-light p-0">확인</button>
            </div>
        </div>

        <button class="btn btn-lg btn-light w-100 mt-30" onclick="location.href=`membership03.html`">회원가입 완료</button>
    </div>
</section>

<script>
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const preview = document.getElementById("preview");

    uploadBtn.addEventListener("click", () => {
        fileInput.click();
    });

    fileInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    });
</script>
@@include('partials/html-end.html')
