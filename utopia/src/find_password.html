@@include('partials/html-start.html', { "title": "비밀번호찾기" })
<header class="header_bar sty05">
    <button class="btn back p-0">
        <img src="@@imgPath/ico/ico_back.png" onclick="history.back()" alt="뒤로가기">
    </button>
    <p class="title">비밀번호 찾기</p>
</header>
<section class="contents">
    <div class="inner">
        <div class="form-group mt-50">
            <label class="tit" for="formGroupExampleInput">아이디 <span class="required">*</span></label>
            <div class="input_box d-flex align-items-center">
                <div class="box">
                    <input type="text" class="form-control" id="formGroupExampleInput" placeholder="이메일 형식 입력">
                </div>
                <button class="btn btn-outline-light p-0">인증요청</button>
            </div>
            <div class="input_box d-flex align-items-center mt-10">
                <div class="box">
                    <input type="text" class="form-control" id="formGroupExampleInput" placeholder="이메일 형식 입력">
                </div>
                <button class="btn btn-light p-0">확인</button>
            </div>
            <div class="invalid-feedback" style="display: block;">
                인증번호를 잘못 입력하셨습니다. 다시 입력해 주세요.
            </div>
        </div>
        <div class="form-group mt-30">
            <label class="tit" for="formGroupExampleInput">이름 <span class="required">*</span></label>
            <input type="text" class="form-control" id="formGroupExampleInput" placeholder="이름 입력">
        </div>
        <button class="btn btn-lg btn-light w-100 mt-30" onclick="location.href=`password_reset.html`">다음</button>
    </div>
</section>



@@include('partials/html-end.html')
